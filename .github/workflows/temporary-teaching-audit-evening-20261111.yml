name: Temporary teaching YouTube metadata audit 2026-11-11 evening
on:
  push:
    branches:
      - automation/teaching-audit-20261111-evening
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata extractor
        run: python3 -m pip install --quiet --upgrade yt-dlp
      - name: Audit public playlist metadata without downloading recordings
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, subprocess, datetime
          from pathlib import Path
          root=Path(".")
          pl=(root/"src/data/playlists.ts").read_text()
          vtxt=(root/"src/data/youtubeVideos.ts").read_text()
          urls=list(dict.fromkeys(re.findall(r'https://www\.youtube\.com/playlist\?list=[A-Za-z0-9_-]+',pl)))
          known=set(re.findall(r'videoId:\s*"([A-Za-z0-9_-]{11})"',vtxt))
          def run(args,timeout=100):
              try:
                  r=subprocess.run(args,capture_output=True,text=True,timeout=timeout)
                  if r.returncode or not r.stdout.strip():
                      return None,(r.stderr.strip() or "no metadata")[-700:]
                  return json.loads(r.stdout),None
              except Exception as e:
                  return None,str(e)
          report={"checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"known_count":len(known),"playlists":[]}
          for u in urls:
              pid=u.split("list=")[-1]
              data,err=run(["yt-dlp","--flat-playlist","--dump-single-json","--skip-download","--no-warnings","--quiet","--",u],110)
              row={"id":pid,"ok":bool(data),"error":err,"new":[]}
              if data:
                  entries=data.get("entries") or []
                  row["count"]=len(entries)
                  row["title"]=data.get("title")
                  seen=set()
                  for x in entries:
                      if not isinstance(x,dict):continue
                      vid=x.get("id")
                      if not isinstance(vid,str) or len(vid)!=11 or vid in seen:continue
                      seen.add(vid)
                      if vid in known:continue
                      short={"id":vid,"playlist_title":x.get("title"),"playlist_duration":x.get("duration"),"playlist_url":u}
                      meta,err2=run(["yt-dlp","--dump-single-json","--skip-download","--no-playlist","--no-warnings","--quiet","--","https://www.youtube.com/watch?v="+vid],70)
                      if meta:
                          short.update({k:meta.get(k) for k in ["title","duration","upload_date","release_date","description","live_status","availability","channel","timestamp"]})
                      else:short["detail_error"]=err2
                      row["new"].append(short)
              report["playlists"].append(row)
              print("PLAYLIST_CHECK",pid,"OK" if row["ok"] else "FAIL",row.get("count",0),"NEW",len(row["new"]),flush=True)
          print("AUDIT_JSON_START",flush=True)
          print(json.dumps(report,ensure_ascii=False),flush=True)
          print("AUDIT_JSON_END",flush=True)
          if not next((x["ok"] for x in report["playlists"] if x["id"]=="PLEvis3LHS9Ks"),False):
              raise SystemExit("Primary 2026-2027 playlist cannot be verified")
          
          PY
