name: Audit public teaching playlist catalogue
on:
  push:
    branches:
      - audit-youtube-playlists-20261117
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install YouTube metadata tool
        run: python3 -m pip install -q yt-dlp
      - name: Get exact original playlist episodes and two new videos
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,re,urllib.request
          from urllib.parse import quote
          from pathlib import Path
          previous=Path('src/data/youtubeVideos.ts').read_text()
          known=set(re.findall(r'videoId:\s*"([A-Za-z0-9_-]{11})"',previous))
          ids=[
            ('linear-electrical-old','PLm0oTNdEqyakPZNxPchsnGy7R7BnkP2ML'),
            ('linear-biomedical-old','PLm0oTNdEqyaml_II1IKiInf06g2LTBeyt'),
            ('hedva-engineering','PLm0oTNdEqyalxtp6tUphCnuvojTdVE3Pn'),
            ('linear-current','PLEvis3LHS9Ks'),
          ]
          for label,pid in ids:
            p=subprocess.run(['yt-dlp','--flat-playlist','--dump-single-json','--quiet','--skip-download','--no-warnings','https://www.youtube.com/playlist?list='+pid],capture_output=True,text=True,timeout=100)
            if p.returncode:
              print('ERROR',label,p.stderr[-450:],flush=True)
              continue
            data=json.loads(p.stdout)
            ents=[x for x in data.get('entries') or [] if isinstance(x,dict)]
            print('PLAYLIST',label,pid,json.dumps({'title':data.get('title'),'size':len(ents)},ensure_ascii=False),flush=True)
            for x in ents:
              v={'id':x.get('id'),'title':x.get('title'),'duration':x.get('duration'),'already_imported':x.get('id') in known}
              print('ITEM',label,json.dumps(v,ensure_ascii=False),flush=True)
          u='https://www.youtube.com/@JuanBalagan/videos'
          p=subprocess.run(['yt-dlp','--flat-playlist','--dump-single-json','--quiet','--skip-download','--no-warnings',u],capture_output=True,text=True,timeout=90)
          if p.returncode:
            print('CHANNEL_ERROR',p.stderr[-350:],flush=True)
          else:
            data=json.loads(p.stdout)
            for x in data.get('entries') or []:
              if x and x.get('id') in ['rKNRT8A5ymY','jGjGSJFibiM','9rdJdh6c0XM']:
                v={'id':x.get('id'),'title':x.get('title'),'duration':x.get('duration'),'channel_id':data.get('channel_id'),'already_imported':x.get('id') in known}
                print('NEW',json.dumps(v,ensure_ascii=False),flush=True)
          PY