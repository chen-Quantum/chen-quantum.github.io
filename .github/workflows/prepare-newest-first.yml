name: Prepare and validate newest-first teaching lists (temporary)
on:
  push:
    branches: [feat/teaching-newest-first-20261029]
    paths: [.github/workflows/prepare-newest-first.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only course list presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one match for {old[:80]!r}; found {s.count(old)}')
              p.write_text(s.replace(old, new))
          def add_import(path, line):
              p = Path(path)
              s = p.read_text()
              if not s.startswith('---\n'):
                  raise RuntimeError(f'{path}: not an Astro frontmatter file')
              p.write_text('---\n' + line + '\n' + s[4:])

          current = 'src/components/CurrentLinearAlgebraRecordings.astro'
          replace(current, '.sort((a, b) => a - b);', '.sort((a, b) => b - a);')
          replace(current, 'enter the course download code to open its full PDF.', 'enter the course download code to open its full PDF. Higher tutorial\n    numbers are listed first within each track.')
          replace(current, 'View all three recordings in the original YouTube playlist', 'View all {recordings.length} recordings in the original YouTube playlist')

          feature = 'src/components/FeaturedInternationalEngineering.astro'
          add_import(feature, 'import { newestNumberedFirst } from "../data/teachingOrder";')
          replace(feature, 'engineeringTutorials.map((tutorial)', 'newestNumberedFirst(engineeringTutorials).map((tutorial)')
          replace(feature, 'internationalEarlierRecitations.map((recitation)', 'newestNumberedFirst(internationalEarlierRecitations).map((recitation)')
          replace(feature, '<ol>\n          {newestNumberedFirst', '<ol data-tutorial-order="newest-first">\n          {newestNumberedFirst')
          replace(feature, '            <li>\n              <p class="intl-tutorial-name">', '            <li data-tutorial-number={tutorial.number}>\n              <p class="intl-tutorial-name">')
          replace(feature, 'Browse all {engineeringTutorials.length} individual tutorials', 'Browse all {engineeringTutorials.length} tutorials - latest numbers first')

          international = 'src/pages/teaching/international-engineering.astro'
          add_import(international, 'import { newestNumberedFirst } from "../../data/teachingOrder";')
          replace(international, 'const translatedTutorials = internationalEarlierRecitations;', 'const translatedTutorials = newestNumberedFirst(internationalEarlierRecitations);')
          replace(international, 'engineeringTutorials.map((tutorial)', 'newestNumberedFirst(engineeringTutorials).map((tutorial)')
          replace(international, 'Choose any of the 13 tutorials and download its English PDF.', 'Tutorials are listed by number, latest first. Choose a tutorial and download its English PDF.')

          year = 'src/pages/teaching/2026-2027.astro'
          add_import(year, 'import { newestNumberedFirst } from "../../data/teachingOrder";')
          replace(year, 'engineeringTutorials.map((t)', 'newestNumberedFirst(engineeringTutorials).map((t)')
          replace(year, 'Download a single tutorial in English or Hebrew.', 'Latest tutorial numbers first. Download a single tutorial in English or Hebrew.')

          videos = 'src/data/youtubeVideos.ts'
          replace(videos, 'import { courseFor } from "./courses";', 'import { courseFor } from "./courses";\nimport { newestRecordingsFirst } from "./teachingOrder";')
          replace(videos, '  durationSeconds: number;\n', '  durationSeconds: number;\n  // Optional ISO publication date, verified from YouTube; never inferred.\n  publishedAt?: string;\n')
          replace(videos, 'export const youtubeVideos: YouTubeVideo[] = rawVideos.map((v) => ({', 'export const youtubeVideos: YouTubeVideo[] = newestRecordingsFirst(rawVideos.map((v) => ({')
          replace(videos, '  ...courseFor(v.category),\n}));', '  ...courseFor(v.category),\n})));')

          teaching = 'src/pages/teaching.astro'
          replace(teaching, 'const allTeaching = await getCollection', 'const currentRecordingCount = (track: string) => linearAlgebraVideos.filter(\n  (v) => v.playlistId === "PLEvis3LHS9Ks" && v.track === track,\n).length;\n\nconst allTeaching = await getCollection')
          replace(teaching, '2 recordings · Tutorial PDFs', '{currentRecordingCount("Biomedical Engineering")} recordings · Tutorial PDFs')
          replace(teaching, '1 recording · Tutorial PDFs', '{currentRecordingCount("Electrical Engineering")} recording{currentRecordingCount("Electrical Engineering") === 1 ? "" : "s"} · Tutorial PDFs')
          print('Updated course presentation only; canonical tutorial data and PDFs are unchanged.')
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify order/language/access regressions
        shell: bash
        run: |
          pnpm build
          node --experimental-strip-types scripts/tests/teaching-order.mjs
          python3 -m pip install --quiet pypdf
          python3 scripts/check-booklet-release.py --dist dist > /tmp/booklet-check.json
          python3 scripts/check-tutorial-downloads.py --dist dist > /tmp/tutorial-check.json
          python3 - <<'PY'
          import json
          for name in ('booklet', 'tutorial'):
              data=json.load(open('/tmp/'+name+'-check.json'))
              print(name, data['checks'], 'checks,', len(data['failures']), 'failures')
              assert data['passed']
          PY
      - name: Commit validated source changes to this branch only
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- public src/data/academicYear2026.ts src/data/teachingAccess.ts src/data/tirgulim.ts
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CurrentLinearAlgebraRecordings.astro src/components/FeaturedInternationalEngineering.astro src/pages/teaching/international-engineering.astro src/pages/teaching/2026-2027.astro src/data/youtubeVideos.ts src/pages/teaching.astro
          git commit -m 'feat(teaching): show latest tutorial numbers first across course tabs'
          git push origin HEAD:feat/teaching-newest-first-20261029
