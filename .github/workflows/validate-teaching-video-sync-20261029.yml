name: Validate verified teaching-video sync (temporary)
on:
  push:
    branches:
      - sync/teaching-videos-20261029

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Existing teaching ordering, language and PDF-access checks
        run: node scripts/tests/teaching-order.mjs
      - name: Verify new video's course and playlist placement
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const id='Xy7s8vz1kk4';
          const records=readFileSync('src/data/youtubeVideos.ts','utf8');
          const playlists=readFileSync('src/data/playlists.ts','utf8');
          const ids=[...records.matchAll(/videoId: "([A-Za-z0-9_-]+)"/g)].map(x=>x[1]);
          assert.equal(ids.length,new Set(ids).size,'Unique video identifiers');
          assert.equal(ids.filter(x=>x===id).length,1,'New video appears once');
          assert.ok(records.includes('title: "אלגברה לינארית לביו רפואה -תרגול 2 יום רביעי", videoId: "'+id+'"'));
          assert.ok(records.includes('videoId: "'+id+'", url: "https://www.youtube.com/watch?v='+id+'"'));
          assert.ok(records.includes('duration: "1:33:24", durationSeconds: 5604, publishedAt: "2026-10-29"'));
          assert.ok(playlists.includes('videoIds: ["'+id+'", "xL5B6qhW6g0"'),'Added at start of current-year playlist');
          assert.ok(!records.includes('videoId: "ZxPROZnluZM"'),'Ambiguous office hour was not published');
          for(const [path,prefix] of [
            ['dist/teaching/index.html','archive-current-recordings'],
            ['dist/teaching/2026-2027/index.html','new-recordings']
          ]){
            const html=readFileSync(path,'utf8');
            const b=html.indexOf('id="'+prefix+'-biomedical"');
            const e=html.indexOf('id="'+prefix+'-electrical"');
            assert.ok(b>=0&&e>b,'Both course tracks rendered');
            const biomedical=html.slice(b,e);
            const electrical=html.slice(e);
            assert.ok(biomedical.includes(id),'Biomedical track has video');
            assert.ok(!electrical.includes(id),'Electrical track does not contain new biomedical video');
            assert.ok(biomedical.includes('1:33:24'),'Verified duration rendered');
            assert.ok(biomedical.includes('archive')||biomedical.includes('tutorial-02'),'Supplementary PDF/context remains');
          }
          assert.ok(!readFileSync('dist/teaching/international-engineering/index.html','utf8').includes(id));
          console.log('PASS: video metadata, unique IDs, biomedical-only placement, international isolation');
          JS
