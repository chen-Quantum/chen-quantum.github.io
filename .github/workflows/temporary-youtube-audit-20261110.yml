name: Temporary YouTube metadata audit 2026-11-10
on:
  push:
    branches:
      - automation/youtube-sync-audit-20261110
    paths:
      - .github/workflows/temporary-youtube-audit-20261110.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata-only extractor
        run: python -m pip install --quiet yt-dlp
      - name: Audit tracked playlists and investigate new IDs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess, sys, datetime, pathlib
          source=pathlib.Path('src/data/playlists.ts').read_text()
          videos=pathlib.Path('src/data/youtubeVideos.ts').read_text()
          urls=[s.split('"',1)[0] for s in source.split('url: "')[1:]]
          urls=list(dict.fromkeys(u for u in urls if u.startswith('https://www.youtube.com/playlist?list=')))
          existing={s.split('"',1)[0] for s in videos.split('videoId: "')[1:]}
          out={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'baseline_existing_count':len(existing),'playlists':[]}
          for url in urls:
              pid=url.split('list=')[-1]
              rec={'id':pid,'url':url}
              try:
                  p=subprocess.run(['yt-dlp','--flat-playlist','--no-warnings','--dump-single-json',url],capture_output=True,text=True,timeout=115)
                  if p.returncode or not p.stdout:
                      rec.update(ok=False,error=(p.stderr or 'yt-dlp returned no data')[-650:])
                  else:
                      d=json.loads(p.stdout);entries=d.get('entries') or []
                      new=[e for e in entries if e and e.get('id') and e.get('id') not in existing]
                      rec.update(ok=True,playlist_title=d.get('title',''),total=len(entries),new_count=len(new),new=[])
                      for e in new[:30]:
                          item={'id':e.get('id'),'title':e.get('title'),'duration':e.get('duration'),'upload_date':e.get('upload_date'),'availability':e.get('availability')}
                          try:
                              q=subprocess.run(['yt-dlp','--no-warnings','--skip-download','--dump-single-json','https://www.youtube.com/watch?v='+e['id']],capture_output=True,text=True,timeout=60)
                              if q.returncode==0 and q.stdout:
                                  md=json.loads(q.stdout)
                                  item['verified_full']=True
                                  for k in ('title','duration','upload_date','release_date','timestamp','description','availability','live_status'):
                                      if k in md: item[k]=md[k]
                                  if isinstance(item.get('description'),str):
                                      item['description']=item['description'][:1000]
                              else:
                                  item['verified_full']=False;item['detail_error']=(q.stderr or 'no metadata')[-330:]
                          except Exception as exc: item['verified_full']=False;item['detail_error']=str(exc)
                          rec['new'].append(item)
                      if len(new)>30: rec['truncated_new']=len(new)-30
              except Exception as exc: rec.update(ok=False,error=str(exc))
              out['playlists'].append(rec)
              print('CHECK',pid,'ok=',rec.get('ok'),'total=',rec.get('total'),'new=',rec.get('new_count'),flush=True)
          out['counts']={'ok':sum(bool(x.get('ok')) for x in out['playlists']),'failed':sum(not x.get('ok') for x in out['playlists']),'new':sum(x.get('new_count',0) for x in out['playlists'])}
          pathlib.Path('reports/teaching-sync').mkdir(parents=True,exist_ok=True)
          pathlib.Path('reports/teaching-sync/live-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print('SYNC_SCAN_JSON='+json.dumps(out,ensure_ascii=False,separators=(',',':')),flush=True)
          if out['counts']['ok']==0: sys.exit(1)
          PY
      - name: Upload auditable JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-metadata-audit-20261110
          path: reports/teaching-sync/live-audit.json
          retention-days: 3
