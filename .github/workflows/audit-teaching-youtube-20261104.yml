name: Temporary teaching YouTube scan 2026-11-04
on:
  push:
    branches:
      - audit/teaching-youtube-20261104
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python3 -m pip install --quiet yt-dlp
      - name: Scan registered teaching playlists and inspect candidates
        shell: bash
        run: |
          node scripts/sync-teaching-content.mjs
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          report=json.loads(Path('reports/teaching-sync/latest.json').read_text(encoding='utf-8'))
          known_source=Path('src/data/youtubeVideos.ts').read_text(encoding='utf-8')
          import re
          known=set(re.findall(r'videoId:\\s*"([A-Za-z0-9_-]{6,})"',known_source))
          print('CURRENT_SYNC_JSON_BEGIN')
          print(json.dumps({'time':report['generatedAt'],'existing':report['existingVideoCount'],'playlists':[{k:p.get(k) for k in ('id','ok','totalVideos','newCount','newVideos','error')} for p in report['playlists']]},ensure_ascii=False))
          print('CURRENT_SYNC_JSON_END')
          candidates={v['videoId'] for p in report['playlists'] if p['ok'] for v in p.get('newVideos',[])}
          for vid in sorted(candidates):
            try:
              proc=subprocess.run(['yt-dlp','--no-playlist','--skip-download','--dump-single-json','--no-warnings','https://www.youtube.com/watch?v='+vid],capture_output=True,text=True,timeout=80)
              if proc.returncode:
                print('CANDIDATE_METADATA_FAILURE',vid,proc.stderr[:500].replace('\\n',' '))
                continue
              d=json.loads(proc.stdout)
              print('CANDIDATE_METADATA_JSON',json.dumps({k:d.get(k) for k in ('id','title','duration','upload_date','release_date','availability','live_status','description','channel','uploader')},ensure_ascii=False)[:2500])
            except Exception as e:
              print('CANDIDATE_METADATA_ERROR',vid,repr(e))
          PY
