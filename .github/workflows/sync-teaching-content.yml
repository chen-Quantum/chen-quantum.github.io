name: Teaching content sync (report-only)

# Scheduled, report-only check of the teaching playlists. The workflow does
# NOT modify the repo, does NOT commit, does NOT push, and does NOT open a
# pull request. It uploads a JSON report as a workflow artifact and writes a
# Markdown summary to the Actions run page.
#
# Schedule: Tuesday and Thursday at 00:00 Asia/Jerusalem.
# Manual trigger: enabled via workflow_dispatch.
#
# Notes on the schedule:
#   - GitHub Actions timezone support is used: Tuesday and Thursday at 00:00
#     Asia/Jerusalem. Runs may still be delayed by GitHub load, especially at
#     the top of the hour.
#   - GitHub Actions cannot scan files outside the repo (e.g. ../tirgulim/
#     on the maintainer's Mac). Local PDFs are handled by
#     scripts/local-sync-teaching.sh.

on:
  schedule:
    - cron: "0 0 * * 2,4"
      timezone: "Asia/Jerusalem"
  workflow_dispatch:
  push:
    branches: [audit-teaching-2026-11-16-evening]

permissions:
  contents: read

jobs:
  scan:
    name: Scan teaching playlists (report-only)
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet yt-dlp
          yt-dlp --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run sync (report-only)
        run: node scripts/sync-teaching-content.mjs

      - name: Inspect metadata of any new videos (no download)
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path("reports/teaching-sync/latest.json").read_text())
          print("AUDIT_PLAYLIST_REPORT",json.dumps(report,ensure_ascii=False))
          seen=set()
          for p in report["playlists"]:
              if not p.get("ok"):
                  print("PLAYLIST_SCAN_FAILURE", p["id"],p.get("error",""))
              for v in p.get("newVideos",[]):
                  vid=v["videoId"]
                  if vid in seen:continue
                  seen.add(vid)
                  cmd=["yt-dlp","--no-playlist","--skip-download","--no-warnings","--dump-single-json","https://www.youtube.com/watch?v="+vid]
                  try:
                      x=subprocess.run(cmd,timeout=75,text=True,capture_output=True)
                      if x.returncode:
                          print("DETAIL_FAILED",vid,x.stderr.strip()[:900])
                          continue
                      j=json.loads(x.stdout)
                      data={k:j.get(k) for k in ["id","title","description","duration","upload_date","release_date","availability","live_status","channel","webpage_url"]}
                      print("VERIFIED_VIDEO",json.dumps(data,ensure_ascii=False))
                  except Exception as e:
                      print("DETAIL_ERROR",vid,str(e))
          print("TOTAL_NEW_CANDIDATE_IDS",len(seen))
          PY

      - name: Append report to job summary
        if: always()
        run: |
          {
            echo "## teaching-sync report"
            echo ""
            echo '```json'
            cat reports/teaching-sync/latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-sync-report
          path: reports/teaching-sync/latest.json
          if-no-files-found: warn
          retention-days: 30
