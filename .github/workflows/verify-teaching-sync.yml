name: Verify teaching recording sync
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/youtubeVideos.ts'
      - 'src/data/playlists.ts'
      - 'src/components/CurrentLinearAlgebraRecordings.astro'
      - '.github/workflows/verify-teaching-sync.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/tests/teaching-order.mjs
      - name: Check unique new video IDs and playlist matching
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const videos = fs.readFileSync('src/data/youtubeVideos.ts','utf8');
          const lists = fs.readFileSync('src/data/playlists.ts','utf8');
          const mainList = lists.split('id: "PLEvis3LHS9Ks"')[1];
          assert.ok(mainList);
          for(const id of ['4-6uFqHX-yw','2tMrNminZ9Y','KJ9rZ7OP17k']){
            assert.equal(videos.split('videoId: "'+id+'"').length,2,id+': duplicated or missing');
            assert.ok(mainList.includes('"'+id+'"'),id+': absent from playlist');
          }
          for(const file of ['dist/teaching/index.html','dist/teaching/2026-2027/index.html']){
            const html=fs.readFileSync(file,'utf8');
            for(const id of ['4-6uFqHX-yw','2tMrNminZ9Y','KJ9rZ7OP17k']) assert.ok(html.includes(id),file+': missing '+id);
          }
          NODE
