name: Temporary teaching YouTube audit 2026-11-05
on:
  push:
    branches:
      - audit/teaching-youtube-20261105-sync
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata extractor
        run: python3 -m pip install --quiet yt-dlp
      - name: Scan all tracked playlists and inspect candidates
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          node scripts/sync-teaching-content.mjs
          python3 - <<'PY'
          import json, subprocess, re
          from pathlib import Path
          report=json.loads(Path('reports/teaching-sync/latest.json').read_text('utf-8'))
          known=set(re.findall(r'videoId:\s*"([A-Za-z0-9_-]{6,})"',Path('src/data/youtubeVideos.ts').read_text('utf-8')))
          summary={'scan_time':report['generatedAt'],'known_count':len(known),'playlists':[{k:p.get(k) for k in ('id','ok','totalVideos','newCount','newVideos','error')} for p in report['playlists']]}
          print('SCAN_JSON_BEGIN')
          print(json.dumps(summary,ensure_ascii=False))
          print('SCAN_JSON_END')
          cand={v['videoId'] for p in report['playlists'] if p['ok'] for v in p.get('newVideos',[])}
          for vid in sorted(cand):
            try:
              proc=subprocess.run(['yt-dlp','--no-playlist','--skip-download','--dump-single-json','--no-warnings','https://www.youtube.com/watch?v='+vid],capture_output=True,text=True,timeout=70)
              if proc.returncode:
                print('METADATA_FAILURE',vid,proc.stderr[:600].replace('\\n',' '))
                continue
              d=json.loads(proc.stdout)
              print('METADATA_JSON',json.dumps({k:d.get(k) for k in ('id','title','duration','upload_date','release_date','availability','live_status','description','channel','uploader')},ensure_ascii=False)[:3000])
            except Exception as e:
              print('METADATA_ERROR',vid,repr(e))
          PY
