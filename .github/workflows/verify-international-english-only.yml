name: Verify English-only International Engineering (temporary)
on:
  push:
    branches: [feat/international-engineering-english-only-2027]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm build
      - name: Assert English-only international pages and other courses preserved
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const main=fs.readFileSync('dist/teaching/index.html','utf8');
          const intl=fs.readFileSync('dist/teaching/international-engineering/index.html','utf8');
          const year=fs.readFileSync('dist/teaching/2026-2027/index.html','utf8');
          const start=main.indexOf('id="international-engineering-2026-2027"');
          const stop=main.indexOf('id="academic-year-2026-2027"',start);
          const featured=main.slice(start,stop);
          function check(ok,name){console.log((ok?'PASS':'FAIL')+': '+name);if(!ok)process.exitCode=1;}
          check(start>=0 && stop>start,'International featured course section exists');
          check(!/[\u0590-\u05FF]/u.test(featured),'Featured International course contains no Hebrew text');
          check(!/[\u0590-\u05FF]/u.test(intl),'Dedicated International page contains no Hebrew text');
          check(!featured.includes('tutorial-01-he.pdf') && !featured.includes('linear-algebra-engineering-notes.pdf'),'Featured international section links no Hebrew PDFs');
          check(!intl.includes('tutorial-01-he.pdf') && !intl.includes('logic-appendix-he.pdf') && !intl.includes('linear-algebra-engineering-notes.pdf'),'International materials page links no Hebrew PDFs');
          check(featured.includes('lecture-01-student-notes-en.pdf') && featured.includes('recitation-01-en.pdf') && featured.includes('recitation-02-en.pdf'),'English lecture and translated recitations preserved');
          check(featured.includes('tutorial-01-en.pdf') && featured.includes('tutorial-13-en.pdf'),'13 English tutorial sheets included in featured section');
          check(intl.includes('tutorial-01-en.pdf') && intl.includes('tutorial-13-en.pdf') && intl.includes('logic-appendix-en.pdf'),'Dedicated international page includes English downloads and English appendix');
          check(main.includes('id="archive-current-recordings-biomedical"') && main.includes('id="archive-current-recordings-electrical"'),'Biomedical/electrical recordings anchors preserved');
          check(year.includes('tutorial-01-he.pdf') && year.includes('tutorial-01-en.pdf'),'Other tracks retain bilingual course PDFs');
          check(main.includes('International Engineering'),'International course name shown in English');
          JS
      - name: Check PDF publication consistency
        shell: bash
        run: |
          python3 -m pip install --quiet pypdf
          python3 scripts/check-booklet-release.py --dist dist --report /tmp/booklets-report.json > /tmp/booklets-output.txt || { tail -c 12000 /tmp/booklets-output.txt; exit 1; }
          python3 scripts/check-tutorial-downloads.py --dist dist --report /tmp/tutorials-report.json > /tmp/tutorials-output.txt || { tail -c 12000 /tmp/tutorials-output.txt; exit 1; }
          python3 - <<'PY'
          import json
          for name in ('booklets','tutorials'):
              d=json.load(open('/tmp/'+name+'-report.json'))
              print(name,':',d['checks'],'checks; failures:',len(d['failures']),'passed:',d['passed'])
              if not d['passed']: raise SystemExit(1)
          PY
